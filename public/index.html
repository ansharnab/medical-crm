<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedicApp CRM</title>
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../node_modules/datatables.net-bs5/css/dataTables.bootstrap5.min.css" />
  <link rel="stylesheet" href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="bg-light" data-theme="light">
  <div id="app" class="d-flex min-vh-100">
    <aside id="sidebar" class="bg-white border-end p-3" style="width: 260px;">
      <div class="mb-4">
        <h5 class="fw-bold">MedicApp CRM</h5>
        <p class="text-muted">Medical admin dashboard</p>
      </div>
      <nav class="nav flex-column" id="navLinks"></nav>
      <hr />
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="themeSwitch" />
        <label class="form-check-label" for="themeSwitch">Dark mode</label>
      </div>
    </aside>

    <main class="flex-fill p-3">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 id="pageTitle">Dashboard</h2>
        <button id="btnLogout" class="btn btn-outline-danger btn-sm">Logout</button>
      </div>
      <div id="pageContent"></div>
    </main>
  </div>

  <script src="../node_modules/jquery/dist/jquery.min.js"></script>
  <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../node_modules/datatables.net/js/jquery.dataTables.min.js"></script>
  <script src="../node_modules/datatables.net-bs5/js/dataTables.bootstrap5.min.js"></script>
  <script src="js/services/dataService.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor CRM — Premium Interactive Prototype</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #2563eb; --primary2: #3b82f6; --accent: #06b6d4; --purple: #8b5cf6;
      --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --pink: #ec4899;
      --primary-glow: rgba(37,99,235,0.4);
      --bg: #eef2f7; --bg-elevated: #fff; --text: #0f172a; --text-muted: #64748b;
      --border: rgba(148,163,184,0.22);
      --shadow: 0 8px 32px rgba(15,23,42,0.07);
      --shadow-lg: 0 24px 64px rgba(15,23,42,0.14);
      --radius: 16px; --radius-sm: 12px;
      --font-display: 'Plus Jakarta Sans', Inter, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #070d19; --bg-elevated: #111827; --text: #f1f5f9; --text-muted: #94a3b8;
      --border: rgba(148,163,184,0.1); --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

    /* animated mesh bg */
    .preview-area {
      flex: 1; overflow-y: auto; padding: 20px 24px;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 100% 80% at 10% 0%, rgba(37,99,235,0.07), transparent 50%),
        radial-gradient(ellipse 80% 60% at 90% 10%, rgba(6,182,212,0.06), transparent 45%),
        radial-gradient(ellipse 60% 50% at 50% 100%, rgba(139,92,246,0.05), transparent 40%);
    }

    .app { display: flex; flex-direction: column; height: 100vh; }
    .topbar {
      display: flex; align-items: center; gap: 12px; padding: 10px 18px;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border); z-index: 50;
    }
    [data-theme="dark"] .topbar { background: rgba(17,24,39,0.9); }
    .logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 15px; }
    .logo-icon {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #06b6d4, #8b5cf6);
      background-size: 200% 200%; animation: gradShift 4s ease infinite;
      display: grid; place-items: center; color: #fff; font-size: 20px;
      box-shadow: 0 6px 20px var(--primary-glow);
    }
    @keyframes gradShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }

    .progress-wrap { flex: 1; max-width: 280px; display: none; }
    @media(min-width:768px){.progress-wrap{display:block}}
    .progress-bar { height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg,#2563eb,#06b6d4,#8b5cf6); background-size: 200%; animation: gradShift 3s linear infinite; transition: width 0.5s cubic-bezier(0.34,1.56,0.64,1); }
    .progress-label { font-size: 10px; color: var(--text-muted); text-align: center; margin-top: 3px; }

    .icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-elevated); cursor: pointer; font-size: 16px; transition: all 0.25s; color: var(--text); }
    .icon-btn:hover { background: var(--primary); color: #fff; transform: scale(1.08); box-shadow: 0 4px 16px var(--primary-glow); }

    .badge { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 99px; letter-spacing: 0.02em; }
    .badge-mvp { background: rgba(100,116,139,0.12); color: var(--text-muted); }
    .badge-new { background: linear-gradient(135deg,rgba(37,99,235,0.12),rgba(139,92,246,0.12)); color: var(--primary); border: 1px solid rgba(37,99,235,0.2); }

    .layout { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      width: 250px; background: linear-gradient(180deg,#0c1222 0%,#151d32 100%);
      padding: 14px 10px; overflow-y: auto; flex-shrink: 0; transition: transform 0.35s; z-index: 40;
    }
    .nav-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: #475569; padding: 12px 12px 6px; }
    .nav-btn {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; margin-bottom: 3px;
      border: none; border-radius: 10px; background: transparent; color: #94a3b8;
      font-size: 12px; font-weight: 500; cursor: pointer; text-align: left; transition: all 0.25s;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.06); color: #fff; transform: translateX(3px); }
    .nav-btn.active { background: linear-gradient(135deg,rgba(37,99,235,0.9),rgba(6,182,212,0.7)); color: #fff; box-shadow: 0 4px 20px rgba(37,99,235,0.35); }

    .main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .screen-header { padding: 16px 22px; background: var(--bg-elevated); border-bottom: 1px solid var(--border); }
    .screen-header h2 { font-family: var(--font-display); font-size: 21px; font-weight: 800; letter-spacing: -0.03em; }
    .screen-header p { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    .breadcrumb { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
    .breadcrumb .cur { color: var(--primary); font-weight: 600; }

    .screen-stage { animation: stageIn 0.5s cubic-bezier(0.22,1,0.36,1); }
    @keyframes stageIn { from{opacity:0;transform:translateY(20px) scale(0.97)} to{opacity:1;transform:none} }
    .screen-stage.exit { animation: stageOut 0.22s ease forwards; }
    @keyframes stageOut { to{opacity:0;transform:translateY(-10px)} }

    .panel-right { width: 290px; background: var(--bg-elevated); border-left: 1px solid var(--border); padding: 18px; overflow-y: auto; transition: transform 0.35s; }
    .feature-item {
      display: flex; gap: 10px; padding: 10px; margin-bottom: 7px; background: var(--bg);
      border-radius: 10px; border: 1px solid var(--border); font-size: 11px; line-height: 1.5; color: var(--text-muted);
      animation: fadeUp 0.45s ease backwards;
    }
    .feature-item:nth-child(2){animation-delay:.05s} .feature-item:nth-child(3){animation-delay:.1s} .feature-item:nth-child(4){animation-delay:.15s}
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
    .fdot { width: 7px; height: 7px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
    .fdot.mvp{background:var(--success)} .fdot.new{background:var(--primary);box-shadow:0 0 8px var(--primary-glow)}
    .gap-card { margin-top: 14px; padding: 12px; border-radius: 10px; font-size: 11px; line-height: 1.55; color: var(--text-muted); background: linear-gradient(135deg,rgba(37,99,235,0.05),rgba(139,92,246,0.04)); border: 1px solid rgba(37,99,235,0.12); }

    .footer-nav { display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: var(--bg-elevated); border-top: 1px solid var(--border); }
    .btn { padding: 10px 18px; border-radius: 10px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.25s; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; }
    .btn-primary { background: linear-gradient(135deg,#2563eb,#3b82f6); color: #fff; box-shadow: 0 4px 18px var(--primary-glow); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px var(--primary-glow); }
    .btn-ghost { background: var(--bg); border: 1px solid var(--border); color: var(--text); }
    .btn-play { background: linear-gradient(135deg,#059669,#10b981); color: #fff; }
    .step-dots { flex: 1; display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; }
    .sdot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); transition: all 0.3s; cursor: pointer; }
    .sdot.on { background: var(--primary); transform: scale(1.35); box-shadow: 0 0 10px var(--primary-glow); }
    .sdot.done { background: var(--success); }

    /* ── Cards & layout ── */
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap: 14px; }
    .grid3 { display: grid; grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); gap: 14px; }
    .card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); animation: fadeUp 0.5s ease backwards; }
    .card-head { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; font-family: var(--font-display); }
    .card-body { padding: 16px; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 10px; font-weight: 700; }
    .pill-g { background: rgba(16,185,129,0.12); color: var(--success); }
    .pill-b { background: rgba(37,99,235,0.12); color: var(--primary); }
    .pill-a { background: rgba(245,158,11,0.12); color: var(--warning); }
    .pill-r { background: rgba(239,68,68,0.12); color: var(--danger); }

    .device-frame { background: var(--bg-elevated); border-radius: 18px; border: 1px solid var(--border); box-shadow: var(--shadow-lg); overflow: hidden; }
    .device-bar { display: flex; align-items: center; gap: 7px; padding: 9px 14px; background: var(--bg); border-bottom: 1px solid var(--border); }
    .dd { width: 9px; height: 9px; border-radius: 50%; }
    .dd.r{background:#ef4444}.dd.y{background:#eab308}.dd.g{background:#22c55e}
    .durl { flex: 1; margin-left: 6px; padding: 5px 10px; background: var(--bg-elevated); border-radius: 7px; font-size: 10px; color: var(--text-muted); font-family: monospace; }

    .mock-app { display: flex; min-height: 440px; }
    .mock-side { width: 185px; background: linear-gradient(180deg,#0f172a,#1e293b); padding: 14px 8px; flex-shrink: 0; }
    .mock-brand { color: #fff; font-weight: 800; font-size: 13px; padding: 6px 10px 18px; font-family: var(--font-display); border: none; background: transparent; cursor: pointer; width: 100%; text-align: left; transition: opacity 0.2s; }
    .mock-brand:hover { opacity: 0.85; }
    .mnav { padding: 8px 10px; border-radius: 8px; font-size: 11px; color: #64748b; margin-bottom: 3px; display: block; width: 100%; text-align: left; border: none; background: transparent; font-family: inherit; cursor: pointer; transition: background 0.2s, color 0.2s; }
    .mnav:hover:not(.on):not(:disabled) { background: rgba(255,255,255,0.08); color: #e2e8f0; }
    .mnav.on { background: linear-gradient(135deg,rgba(37,99,235,0.85),rgba(6,182,212,0.6)); color: #fff; }
    .mnav:disabled { opacity: 0.45; cursor: not-allowed; }
    .mock-main { flex: 1; padding: 16px; background: var(--bg); overflow: auto; }

    /* ── KPI cards with sparkline ── */
    .kpis { display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 12px; margin-bottom: 16px; }
    .kpi {
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 16px; position: relative; overflow: hidden; transition: transform 0.3s, box-shadow 0.3s;
      animation: fadeUp 0.5s ease backwards;
    }
    .kpi:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }
    .kpi-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; margin-bottom: 10px; }
    .kpi label { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .kpi .val { font-family: var(--font-display); font-size: 26px; font-weight: 800; margin: 4px 0; letter-spacing: -0.03em; }
    .kpi .trend { font-size: 10px; font-weight: 700; }
    .kpi .trend.up { color: var(--success); }
    .kpi-spark { position: absolute; bottom: 0; right: 0; left: 0; height: 40px; opacity: 0.6; }

    /* ── Charts ── */
    .chart-wrap { position: relative; }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-muted); font-weight: 500; }
    .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

    .donut-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .donut {
      width: 130px; height: 130px; border-radius: 50%; position: relative;
      animation: donutSpin 1s cubic-bezier(0.34,1.56,0.64,1) backwards;
    }
    @keyframes donutSpin { from{transform:scale(0) rotate(-90deg);opacity:0} to{transform:scale(1) rotate(0);opacity:1} }
    .donut-hole {
      position: absolute; inset: 22px; border-radius: 50%; background: var(--bg-elevated);
      display: grid; place-items: center; text-align: center;
    }
    .donut-hole strong { font-family: var(--font-display); font-size: 22px; font-weight: 800; display: block; }
    .donut-hole span { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

    .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 130px; padding: 0 4px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
    .bar-fill {
      width: 100%; border-radius: 6px 6px 2px 2px; min-height: 4px;
      animation: barUp 0.9s cubic-bezier(0.34,1.56,0.64,1) backwards;
      position: relative; overflow: hidden;
    }
    .bar-fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg,rgba(255,255,255,0.25),transparent); }
    @keyframes barUp { from{height:0!important;opacity:0} }
    .bar-label { font-size: 9px; color: var(--text-muted); font-weight: 600; }

    .h-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 11px; }
    .h-bar-label { width: 80px; flex-shrink: 0; font-weight: 600; color: var(--text-muted); font-size: 10px; }
    .h-bar-track { flex: 1; height: 10px; background: var(--bg); border-radius: 99px; overflow: hidden; }
    .h-bar-fill { height: 100%; border-radius: 99px; animation: hBarGrow 0.8s cubic-bezier(0.34,1.56,0.64,1) backwards; }
    @keyframes hBarGrow { from{width:0!important} }
    .h-bar-val { width: 36px; text-align: right; font-weight: 700; font-size: 10px; }

    .area-chart svg { width: 100%; height: auto; display: block; }
    .area-line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .area-fill { opacity: 0.15; }

    .gauge-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .gauge { text-align: center; }
    .gauge svg { display: block; margin: 0 auto; }
    .gauge-label { font-size: 10px; color: var(--text-muted); margin-top: 4px; font-weight: 600; }
    .gauge-val { font-family: var(--font-display); font-size: 14px; font-weight: 800; }

    .heatmap { display: grid; grid-template-columns: repeat(12,1fr); gap: 4px; }
    .hm-cell {
      aspect-ratio: 1; border-radius: 4px; animation: hmPop 0.4s ease backwards;
      transition: transform 0.2s;
    }
    .hm-cell:hover { transform: scale(1.15); }
    @keyframes hmPop { from{opacity:0;transform:scale(0.5)} }

    .queue-cards { display: flex; gap: 12px; flex-wrap: wrap; }
    .qcard {
      flex: 1; min-width: 140px; padding: 16px; border-radius: var(--radius); text-align: center;
      border: 2px solid var(--border); background: var(--bg-elevated);
      animation: fadeUp 0.5s ease backwards; transition: all 0.3s;
    }
    .qcard.active { border-color: var(--primary); box-shadow: 0 0 24px var(--primary-glow); transform: scale(1.03); }
    .qcard .token { font-family: var(--font-display); font-size: 32px; font-weight: 800; color: var(--primary); }
    .qcard .name { font-size: 12px; font-weight: 600; margin-top: 4px; }
    .qcard .wait { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

    .login-scene { display: flex; min-height: 420px; }
    .login-left {
      flex: 1.1; padding: 36px; color: #fff; position: relative; overflow: hidden;
      background: linear-gradient(135deg,#0f172a 0%,#1e3a8a 40%,#2563eb 70%,#06b6d4 100%);
      display: flex; flex-direction: column; justify-content: center;
    }
    .login-left::before {
      content: ''; position: absolute; inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .login-left h2 { font-family: var(--font-display); font-size: 30px; font-weight: 800; line-height: 1.2; position: relative; z-index: 1; }
    .login-left p { font-size: 13px; opacity: 0.88; line-height: 1.65; margin-top: 12px; position: relative; z-index: 1; max-width: 320px; }
    .login-stats { display: flex; gap: 20px; margin-top: 28px; position: relative; z-index: 1; }
    .login-stat strong { font-family: var(--font-display); font-size: 24px; display: block; }
    .login-stat span { font-size: 10px; opacity: 0.7; }
    .login-right { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; background: var(--bg-elevated); }
    .login-form { width: 100%; max-width: 320px; }
    .login-form h3 { font-family: var(--font-display); font-size: 22px; font-weight: 800; margin-bottom: 20px; }
    .field { width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); font-size: 13px; margin-top: 5px; }
    .field-label { font-size: 11px; font-weight: 600; color: var(--text-muted); }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { padding: 9px 12px; text-align: left; font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); background: var(--bg); font-weight: 700; }
    td { padding: 10px 12px; border-top: 1px solid var(--border); }
    tbody tr { transition: background 0.2s; }
    tbody tr:hover { background: rgba(37,99,235,0.04); }

    .hero-banner {
      border-radius: var(--radius); padding: 28px; margin-bottom: 18px; color: #fff; position: relative; overflow: hidden;
      background: linear-gradient(135deg,#1e40af,#2563eb 40%,#7c3aed);
      box-shadow: 0 16px 48px rgba(37,99,235,0.3);
    }
    .hero-banner h2 { font-family: var(--font-display); font-size: 26px; font-weight: 800; }
    .hero-banner p { font-size: 13px; opacity: 0.9; margin-top: 8px; max-width: 500px; line-height: 1.6; }
    .hero-banner .orbs { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); opacity: 0.5; }

    .module-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap: 12px; }
    .module-card {
      padding: 18px; border-radius: var(--radius); background: var(--bg-elevated); border: 1px solid var(--border);
      text-align: center; transition: all 0.3s; cursor: default;
    }
    .module-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); border-color: rgba(37,99,235,0.3); }
    .module-card .icon { font-size: 28px; margin-bottom: 8px; }
    .module-card strong { font-size: 12px; font-family: var(--font-display); display: block; }
    .module-card span { font-size: 10px; color: var(--text-muted); margin-top: 4px; display: block; }

    .rx-visual { display: flex; gap: 10px; align-items: center; padding: 12px; background: var(--bg); border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--border); animation: fadeUp 0.4s ease backwards; }
    .rx-pill { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }

    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(60px); background: #0f172a; color: #fff; padding: 11px 22px; border-radius: 99px; font-size: 12px; font-weight: 600; z-index: 200; opacity: 0; transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1); box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 35; }
    .sidebar-overlay.open { display: block; }

    @media(max-width:1024px) {
      .panel-right { position: fixed; right: 0; top: 0; bottom: 0; z-index: 45; transform: translateX(100%); box-shadow: var(--shadow-lg); }
      .panel-right.open { transform: translateX(0); }
    }
    @media(max-width:768px) {
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); box-shadow: var(--shadow-lg); }
      .sidebar.open { transform: translateX(0); }
      .login-scene { flex-direction: column; }
      .mock-side { display: none; }
      .step-dots { display: none; }
      .kpis { grid-template-columns: repeat(2,1fr); }
    }

    /* ── Interactive / working UI ── */
    .hint-bar {
      display: flex; align-items: center; gap: 8px; padding: 10px 14px; margin-bottom: 14px;
      background: linear-gradient(135deg, rgba(37,99,235,0.1), rgba(6,182,212,0.06));
      border: 1px dashed rgba(37,99,235,0.35); border-radius: 10px; font-size: 11px; color: var(--primary); font-weight: 600;
    }
    .hint-bar span { opacity: 0.7; font-weight: 500; color: var(--text-muted); }

  const items = S.activity.slice(0, 6).map(a => `<div class="act-item"><span class="act-time">${a.t}</span>${a.msg}</div>`).join('');

function refreshActItems() {

/* ── Chart builders ── */
const Charts = {
  spark(vals, color, w=80, h=32) {
    const max = Math.max(...vals), min = Math.min(...vals), range = max - min || 1;
    const pts = vals.map((v,i) => `${(i/(vals.length-1))*w},${h - ((v-min)/range)*(h-4) - 2}`).join(' ');
    const area = `0,${h} ${pts} ${w},${h}`;
    return `<svg width="${w}" height="${h}" class="kpi-spark"><defs><linearGradient id="sg${color.replace('#','')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.3"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon points="${area}" fill="url(#sg${color.replace('#','')})"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round"/></svg>`;
  },

  donut(segments, totalLabel='Total') {
    let grad = segments.map((s,i) => {
      const start = segments.slice(0,i).reduce((a,x)=>a+x.pct,0);
      return `${s.color} ${start}% ${start+s.pct}%`;
    }).join(', ');
    const sum = segments.reduce((a,s)=>a+s.val,0);
    const legend = segments.map(s => `<div class="legend-item"><div class="legend-dot" style="background:${s.color}"></div>${s.label} · ${s.val}</div>`).join('');
    return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${grad})"><div class="donut-hole"><strong>${sum}</strong><span>${totalLabel}</span></div></div><div class="chart-legend" style="flex-direction:column;align-items:flex-start">${legend}</div></div>`;
  },

  bars(data, opts={}) {
    const max = Math.max(...data.map(d=>d.val));
    return `<div class="bar-chart">${data.map((d,i)=>`
      <div class="bar-col">
        <div class="bar-fill" style="height:${(d.val/max)*100}%;background:linear-gradient(180deg,${d.color||C.blue},${d.color2||C.cyan});animation-delay:${i*0.07}s"></div>
        <div class="bar-label">${d.label}</div>
      </div>`).join('')}</div>`;
  },

  hBars(data) {
    const max = Math.max(...data.map(d=>d.val));
    return data.map((d,i)=>`
      <div class="h-bar-row">
        <div class="h-bar-label">${d.label}</div>
        <div class="h-bar-track"><div class="h-bar-fill" style="width:${(d.val/max)*100}%;background:linear-gradient(90deg,${d.color||C.blue},${d.color2||C.cyan});animation-delay:${i*0.08}s"></div></div>
        <div class="h-bar-val">${d.display||d.val}</div>
      </div>`).join('');
  },

  area(data, color=C.blue, w=300, h=100) {
    const max = Math.max(...data), min = Math.min(...data)*0.85, range = max-min||1;
    const pts = data.map((v,i) => `${(i/(data.length-1))*w},${h-4-((v-min)/range)*(h-12)}`);
    const line = pts.join(' ');
    const area = `0,${h} ${line} ${w},${h}`;
    return `<div class="area-chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon points="${area}" fill="url(#ag)"/><polyline points="${line}" class="area-line" stroke="${color}"/></svg></div>`;
  },

  gauge(val, max, label, color=C.blue, size=80) {
    const pct = val/max, r=30, circ=2*Math.PI*r, offset=circ*(1-pct);
    return `<div class="gauge"><svg width="${size}" height="${size/2+10}" viewBox="0 0 80 50"><path d="M 10 45 A 30 30 0 0 1 70 45" fill="none" stroke="var(--border)" stroke-width="6" stroke-linecap="round"/><path d="M 10 45 A 30 30 0 0 1 70 45" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${circ/2}" stroke-dashoffset="${circ/2*(1-pct)}" style="transition:stroke-dashoffset 1s ease"/><text x="40" y="42" text-anchor="middle" font-size="13" font-weight="800" fill="var(--text)" font-family="Plus Jakarta Sans">${val}</text></svg><div class="gauge-label">${label}</div></div>`;
  },

  heatmap(hours) {
    const max = Math.max(...hours);
    return `<div class="heatmap">${hours.map((v,i)=>{
      const intensity = v/max;
      const col = intensity>0.8?C.blue:intensity>0.5?'#3b82f6':intensity>0.3?'#93c5fd':'#dbeafe';
      return `<div class="hm-cell" style="background:${col};animation-delay:${i*0.03}s" title="${i+8}:00 — ${v} patients"></div>`;
    }).join('')}</div><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-muted);margin-top:6px"><span>8 AM</span><span>12 PM</span><span>8 PM</span></div>`;
  },

  pieSvg(segments, size=140) {
    let total = segments.reduce((a,s)=>a+s.val,0), angle=0, paths='';
    segments.forEach(s => {
      const a1 = angle, a2 = angle + (s.val/total)*360; angle = a2;
      const r=size/2-4, cx=size/2, cy=size/2;
      const x1=cx+r*Math.cos((a1-90)*Math.PI/180), y1=cy+r*Math.sin((a1-90)*Math.PI/180);
      const x2=cx+r*Math.cos((a2-90)*Math.PI/180), y2=cy+r*Math.sin((a2-90)*Math.PI/180);
      const large = a2-a1>180?1:0;
      paths+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="${s.color}" opacity="0.9"><title>${s.label}: ${s.val}</title></path>`;
    });
    return `<svg width="${size}" height="${size}" style="animation:donutSpin 0.8s ease">${paths}<circle cx="${size/2}" cy="${size/2}" r="${size/5}" fill="var(--bg-elevated)"/></svg>`;
  },

  interactiveArea(data, color, w, h, labels) {
    const onCover=App.current==='cover';
    const max = Math.max(...data), min = Math.min(...data)*0.85, range = max-min||1;
    const pts = data.map((v,i) => `${(i/(data.length-1))*w},${h-4-((v-min)/range)*(h-12)}`);
    const line = pts.join(' ');
    const area = `0,${h} ${line} ${w},${h}`;
    const dots = data.map((v,i)=>{
      const x=(i/(data.length-1))*w, y=h-4-((v-min)/range)*(h-12);
      const lbl=labels?.[i]||`Day ${i+1}`;
      return `<circle class="area-dot ${onCover&&S.coverSelectedDay===i?'sel':''}" cx="${x}" cy="${y}" r="5" data-rev-day="${i}" data-rev-val="${v}" data-rev-lbl="${lbl}"/>`;
    }).join('');
    return `<div class="area-interactive chart-card-body"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px;width:100%"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon points="${area}" fill="url(#ag)"/><polyline points="${line}" class="area-line" stroke="${color}"/>${dots}</svg></div>`;
  },

  interactiveDonut(segments, totalLabel, chartCtx) {
    const selKey=chartCtx==='billing'?S.billingChartSel:(App.current==='cover'?S.coverApptFilter:null);
    let grad = segments.map((s,i) => {
      const start = segments.slice(0,i).reduce((a,x)=>a+x.pct,0);
      return `${s.color} ${start}% ${start+s.pct}%`;
    }).join(', ');
    const sum = segments.reduce((a,s)=>a+s.val,0);
    const legend = segments.map(s => `<button type="button" class="legend-btn ${selKey===s.label?'sel':''}" data-segment="${s.label}" ${chartCtx?`data-chart-ctx="${chartCtx}"`:''}><div class="legend-dot" style="background:${s.color}"></div>${s.label} · ${s.val}</button>`).join('');
    return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${grad})"><div class="donut-hole"><strong>${sum}</strong><span>${totalLabel}</span></div></div><div class="chart-legend" style="flex-direction:column;align-items:stretch">${legend}</div></div>`;
  },

  interactiveHeatmap(hours) {
    const onCover=App.current==='cover';
    const max = Math.max(...hours);
    const labels = ['8 AM','9 AM','10 AM','11 AM','12 PM','1 PM','2 PM','3 PM','4 PM','5 PM','6 PM','7 PM'];
    return `<div class="heatmap">${hours.map((v,i)=>{
      const intensity = v/max;
      const col = intensity>0.8?C.blue:intensity>0.5?'#3b82f6':intensity>0.3?'#93c5fd':'#dbeafe';
      return `<div class="hm-cell ${onCover&&S.coverPeakHour===i?'sel':''}" data-hm="${i}" data-hm-val="${v}" data-hm-lbl="${labels[i]}" style="background:${col};animation-delay:${i*0.03}s" title="${labels[i]} — ${v} patients"></div>`;
    }).join('')}</div><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-muted);margin-top:6px"><span>8 AM</span><span>12 PM</span><span>8 PM</span></div>`;
  },

  interactiveBars(data, prefix='bar') {
    const onCover=App.current==='cover';
    const max = Math.max(...data.map(d=>d.val));
    return `<div class="bar-chart">${data.map((d,i)=>`
      <div class="bar-col">
        <div class="bar-fill click-bar ${onCover&&S.coverSelectedDay===i?'sel':''}" data-${prefix}="${i}" data-${prefix}-val="${d.val}" data-${prefix}-lbl="${d.label}" style="height:${(d.val/max)*100}%;background:linear-gradient(180deg,${d.color||C.blue},${d.color2||C.cyan});animation-delay:${i*0.07}s"></div>
        <div class="bar-label">${d.label}</div>
      </div>`).join('')}</div>`;
  },

  interactiveHBar(data, prefix='doc') {
    const onCover=App.current==='cover';
    const max = Math.max(...data.map(d=>d.val));
    return data.map((d,i)=>`
      <div class="h-bar-row click-doc ${onCover&&S.coverDoctor===d.label?'sel':''}" data-${prefix}="${d.label}" data-${prefix}-val="${d.val}">
        <div class="h-bar-label">${d.label}</div>
        <div class="h-bar-track"><div class="h-bar-fill" style="width:${(d.val/max)*100}%;background:linear-gradient(90deg,${d.color||C.blue},${d.color2||C.cyan});animation-delay:${i*0.08}s"></div></div>
        <div class="h-bar-val">${d.display||d.val}</div>
      </div>`).join('');
  }
};

function apptMix() {
  return {
    completed: 48 + (S.consultDone ? 1 : 0),
    waiting: Math.max(0, 22 + S.waiting - 6),
    scheduled: 18 + Math.max(0, S.appointments.length - 3),
    cancelled: 12,
  };
}
function apptMixSegments() {
  const m = apptMix();
  const total = m.completed + m.waiting + m.scheduled + m.cancelled;
  const pct = v => Math.round((v/total)*100);
  return [
    { label:'Completed', val:m.completed, pct:pct(m.completed), color:C.green },
    { label:'Waiting', val:m.waiting, pct:pct(m.waiting), color:C.amber },
    { label:'Scheduled', val:m.scheduled, pct:pct(m.scheduled), color:C.blue },
    { label:'Cancelled', val:m.cancelled, pct:pct(m.cancelled), color:C.red },
  ];
}
function coverRevenueData() {
  if (S.coverPeriod === '30d') return {
    data:[120,180,150,220,190,280,260,320,290,380,350,420],
    labels:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],

  return {

function coverPeakHours() {
  const base = [2,4,8,12,18,22,20,16,14,10,8,6];
  if (S.waiting > 6) base[4] = Math.min(24, base[4] + (S.waiting - 6));
  if (S.coverPeakHour !== null) base[S.coverPeakHour] = Math.min(24, base[S.coverPeakHour] + 2);
  return base;
}

    const { data, labels } = coverRevenueData();
    return `<strong>${labels[S.coverSelectedDay]}</strong> — Revenue ${money(data[S.coverSelectedDay]*100)} · Click another point or simulate payment`;

const DEMO_STORAGE_KEY = 'doctor-crm-demo-v1';
function saveDemoState() {
  try { localStorage.setItem(DEMO_STORAGE_KEY, JSON.stringify({ S, current: App.current, history: App.history })); } catch (_) {}
}
function loadDemoState() {
  try {
    const raw = localStorage.getItem(DEMO_STORAGE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.S) Object.assign(S, d.S);
    if (d.current) App.current = d.current;
    if (d.history) App.history = d.history || [];
  } catch (_) {}
}
function smsNotify(msg) {
  const el = document.getElementById('smsToast');
  if (!el) return;
  el.textContent = msg || 'WhatsApp sent ✓';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}
const TOUR_STEPS = [
  { sel: '[data-flow="e2e"]', text: 'Start here — full patient journey demo.' },
  { sel: '#nextBtn', text: 'Step forward through the flow with Next →' },
  { sel: '#presentBtn', text: 'Presenter mode hides chrome for stakeholder meetings.' },
  { sel: '[data-go="nm-billing"]', text: 'Jump to NEW modules anytime from sidebar.' },
];
let tourIdx = 0;
function runTour() {
  const root = document.getElementById('tourRoot');
  if (tourIdx >= TOUR_STEPS.length) { root.innerHTML = ''; tourIdx = 0; return; }
  const step = TOUR_STEPS[tourIdx];
  const target = document.querySelector(step.sel);
  root.innerHTML = `<div class="tour-spotlight"></div><div class="tour-box" style="top:80px;right:24px"><p style="font-size:13px;line-height:1.5">${step.text}</p><button type="button" id="tourNext">${tourIdx < TOUR_STEPS.length - 1 ? 'Next' : 'Done'}</button></div>`;
  document.getElementById('tourNext').onclick = () => { tourIdx++; runTour(); };
  if (target) target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
let uiLang = localStorage.getItem('demo-lang') || 'en';
const I18N = {
  en: { next: 'Next →', back: '← Back', reset: '↺ Reset', auto: '▶ Auto demo' },
  hi: { next: 'आगे →', back: '← पीछे', reset: '↺ रीसेट', auto: '▶ ऑटो डेमो' },
};
function applyLang() {
  const t = I18N[uiLang] || I18N.en;
  const n = document.getElementById('nextBtn'); if (n) n.textContent = t.next;
  const p = document.getElementById('prevBtn'); if (p) p.textContent = t.back;
  const r = document.getElementById('resetBtn'); if (r) r.textContent = t.reset;
  const a = document.getElementById('autoBtn'); if (a && !App.auto) a.textContent = t.auto;
}

const App = {
  current:'cover', flow:E2E, auto:null, liveTimer:null, history:[], _searchTimer:null,
  init() {
    loadDemoState();
    this.render();
    applyLang();
    document.getElementById('nextBtn').onclick=()=>this.next();
    document.getElementById('prevBtn').onclick=()=>this.prev();
    document.getElementById('autoBtn').onclick=()=>this.toggleAuto();
    document.getElementById('themeBtn').onclick=()=>{ document.documentElement.dataset.theme = document.documentElement.dataset.theme==='dark'?'light':'dark'; };
    document.getElementById('presentBtn').onclick=()=>{ document.documentElement.classList.toggle('presenter-mode'); this.toast(document.documentElement.classList.contains('presenter-mode')?'Presenter mode ON':'Presenter mode OFF'); };
    document.getElementById('tourBtn').onclick=()=>{ tourIdx=0; runTour(); };
    document.getElementById('langBtn').onclick=()=>{ uiLang=uiLang==='en'?'hi':'en'; localStorage.setItem('demo-lang',uiLang); applyLang(); this.toast(uiLang==='hi'?'हिंदी UI':'English UI'); };
    document.getElementById('menuBtn').onclick=()=>this.toggleSb();
    document.getElementById('panelBtn').onclick=()=>document.getElementById('panel').classList.toggle('open');
    document.getElementById('overlay').onclick=()=>{this.toggleSb(false);document.getElementById('panel').classList.remove('open');closeModal();};
    document.querySelectorAll('[data-flow]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-flow]').forEach(x=>x.classList.remove('active'));b.classList.add('active');this.startFlow(b.dataset.flow);this.toggleSb(false);});
    document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{this.go(b.dataset.go);this.toggleSb(false);});
    document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')this.next();if(e.key==='ArrowLeft')this.prev();});
    document.getElementById('resetBtn').onclick=()=>resetDemo();
    document.getElementById('modalRoot').addEventListener('click',e=>{
      if(e.target.dataset.close!==undefined){closeModal();return;}
      const btn=e.target.closest('[data-action]');
      if(btn)this.runAction(btn.dataset.action);
    });
  },
  runAction(a){
    const go=id=>{closeModal();this.go(id);};
    if(a==='go-add-patient')this.go('rc-add-patient');
    else if(a==='go-book')go('rc-book-appt');
    else if(a==='go-payment')this.go('rc-payment');
    else if(a==='go-queue')this.go('rc-queue');
    else if(a==='go-dr-queue')this.go('dr-queue');
    else if(a==='go-rx')this.go('dr-prescription');
    else if(a==='go-analytics')this.go('ca-analytics');
    else if(a==='go-billing')this.go('nm-billing');
    else if(a==='go-sa-clinics')this.go('sa-clinics');
    else if(a==='clear-form'){S.patient={name:'',phone:'',age:'',gender:'Male'};this.refresh(true);}
    else if(a==='simulate-payment'){
      S.paid=true; S.revenue+=500; if(!S.receiptId) S.receiptId=String(Date.now()).slice(-6);
      const pending=S.invoices.find(i=>i.status==='pending');
      if(pending)pending.status='paid';
      log('Simulated ₹500 payment — charts updated');
      this.refresh(true);
    }
  },
  go(id, opts={}) {
    if (!SCREENS[id]) return;
    if (this.current === 'cover' && id !== 'cover') {
      S.coverApptFilter = null; S.coverSelectedDay = null; S.coverPeakHour = null; S.coverDoctor = null;
    }
    if (!opts.noHistory && !opts.fromBack && id !== this.current) this.history.push(this.current);
    if (this.history.length > 30) this.history.shift();
    this.anim(() => { this.current = id; this.render(); }, !!opts.instant);
  },
  startFlow(n) {
    const m={e2e:E2E,reception:E2E.slice(1,6),doctor:E2E.slice(6,10),new:['nm-billing','nm-pharmacy','nm-portal','dr-prescription'],super:['sa-dashboard','sa-clinics','nm-audit']};
    this.flow=m[n]||E2E;
    this.history=[];
    this.anim(()=>{this.current=this.flow[0];this.render();});
  },
  next(){
    if(this.current==='cover'){this.startFlow('e2e');return;}
    const i=this.flow.indexOf(this.current);
    if(i>=0&&i<this.flow.length-1){
      this.history.push(this.current);
      this.anim(()=>{this.current=this.flow[i+1];this.render();});
    } else this.toast('Demo complete!');
  },
  prev(){
    if(this.history.length){
      const prevId=this.history.pop();
      this.go(prevId,{fromBack:true,noHistory:true,instant:false});
      return;
    }
    const i=this.flow.indexOf(this.current);
    if(i>0)this.anim(()=>{this.current=this.flow[i-1];this.render();});
    else if(this.current!=='cover')this.anim(()=>{this.current='cover';this.render();});
  },
  toggleAuto(){if(this.auto){clearInterval(this.auto);this.auto=null;document.getElementById('autoBtn').textContent='▶ Auto demo';return;}if(this.current==='cover')this.startFlow('e2e');document.getElementById('autoBtn').textContent='⏸ Stop';this.auto=setInterval(()=>{if(this.flow.indexOf(this.current)>=this.flow.length-1){this.toggleAuto();return;}this.next();},3500);},
  toggleSb(o){const s=document.getElementById('sidebar'),v=document.getElementById('overlay'),on=o!==undefined?o:!s.classList.contains('open');s.classList.toggle('open',on);v.classList.toggle('open',on);},
  toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);},
  anim(cb,instant){
    const st=document.getElementById('stage');
    if(instant){cb();return;}
    st.classList.add('exit');
    setTimeout(()=>{cb();st.classList.remove('exit');},200);
  },
  refresh(silent=false){
    const s=SCREENS[this.current];
    if(!s)return;
    const stage=document.getElementById('stage');
    if(silent)stage.classList.add('no-animate');
    stage.innerHTML=s.render();
    this.bindScreen();
    if(silent)requestAnimationFrame(()=>stage.classList.remove('no-animate'));
  },
  updateQueueTimers(){
    document.querySelectorAll('[data-queue-wait]').forEach(el=>{
      const q=S.queue.find(x=>x.token===+el.dataset.queueWait);
      if(!q)return;
      if(q.status==='in-consult')el.textContent=q.doctor+' · In consult';
      else if(q.status==='called')el.textContent=q.doctor+' · Called ✓';
      else el.textContent=`${q.doctor} · ${q.wait}m wait${q.status==='urgent'?' · URGENT':''}`;
    });
    const drWait=document.querySelector('[data-dr-queue-wait]');
    const next=S.queue.find(q=>q.status==='next');
    if(drWait&&next)drWait.textContent=next.wait+'m';
  },
  updateLiveKpis(){
    document.querySelectorAll('[data-kpi]').forEach(k=>{
      const l=k.dataset.kpi;
      const val=k.querySelector('.val');
      if(!val)return;
      if(l.includes('Revenue')||l.includes('Today')&&l.includes('₹'))val.textContent=money(S.revenue);
      else if(l.includes('Waiting')||l.includes('Queue'))val.textContent=String(S.waiting);
      else if(l.includes('Patients'))val.textContent=String(S.patients);
    });
  },
  tickLive(){
    document.querySelectorAll('#liveClock').forEach(el=>{el.textContent=now();});
    if(!['rc-queue','dr-queue'].includes(this.current))return;
    S.queue.forEach(q=>{
      if(q.status!=='waiting'&&q.status!=='next'&&q.status!=='urgent')return;
      if(q.waitSec==null)q.waitSec=q.wait*60;
      q.waitSec+=1;
      q.wait=Math.floor(q.waitSec/60);
    });
    this.updateQueueTimers();
  },
  startLive(){
    this.stopLive();
    this.liveTimer=setInterval(()=>this.tickLive(),1000);
  },
  stopLive(){if(this.liveTimer){clearInterval(this.liveTimer);this.liveTimer=null;}},
  syncNav(){
    document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active', b.dataset.go === this.current));
  },
  bindScreen(){

    });

    const patchDetail=()=>{const el=document.getElementById('chartDetail');if(el)el.innerHTML=coverChartDetail();};

    // ── Cover dashboard — interactive charts ──
    st.querySelector('#startDemoBtn')?.addEventListener('click',()=>{log('Starting end-to-end demo');this.startFlow('e2e');});
    st.querySelectorAll('[data-period]').forEach(btn=>btn.onclick=()=>{
      S.coverPeriod=btn.dataset.period; S.coverSelectedDay=null;

    });
    st.querySelectorAll('[data-rev-day]').forEach(dot=>dot.onclick=e=>{
      e.stopPropagation();
      S.coverSelectedDay=+dot.dataset.revDay; S.coverPeakHour=null; S.coverApptFilter=null; S.coverDoctor=null;
      log(`${dot.dataset.revLbl}: ${money(+dot.dataset.revVal*100)} revenue`);

    st.querySelectorAll('[data-segment]').forEach(btn=>btn.onclick=()=>{

      if(chartCtx==='billing'){

      if(App.current!=='cover')return;

    st.querySelectorAll('[data-hm]').forEach(cell=>cell.onclick=()=>{

    st.querySelectorAll('[data-doc]').forEach(row=>row.onclick=()=>{

    });
    st.querySelectorAll('[data-traffic]').forEach(bar=>bar.onclick=()=>log(`Hour ${bar.dataset.trafficLbl}: ${bar.dataset.trafficVal} patients`));

    st.querySelectorAll('[data-inv-filter]').forEach(btn=>btn.onclick=()=>{S.invoiceFilter=btn.dataset.invFilter;this.refresh(true);});

        ${inv.status!=='paid'?`<button class="btn btn-primary" style="width:100%;margin-top:10px;justify-content:center" id="modalMarkPaid">Mark as Paid →</button>`:''}
        <button class="btn btn-ghost" style="width:100%;margin-top:8px;justify-content:center" data-action="go-payment">Collect at Reception</button>`);
      document.getElementById('modalMarkPaid')?.addEventListener('click',()=>{
        inv.status='paid'; S.revenue+=inv.amount; if(!S.receiptId)S.receiptId=String(Date.now()).slice(-6);
        closeModal(); log(`${inv.id} marked paid`); App.refresh(true);
      });
    });
    st.querySelector('#createInvoiceBtn')?.addEventListener('click',()=>{
      const id='INV-'+Math.floor(1045+Math.random()*9000);

    });

    });
    st.querySelectorAll('[data-restock]').forEach(btn=>btn.onclick=()=>{
      const item=S.pharmacyStock.find(s=>s.id===+btn.dataset.restock);
      if(!item)return;
      item.qty+=50; log(`Restocked ${item.name} → ${item.qty}`); this.refresh(true);
    });
    st.querySelectorAll('[data-rx-dispense]').forEach(btn=>btn.onclick=()=>{
      const rx=S.rx.find(r=>r.id===+btn.dataset.rxDispense);
      if(!rx)return;
      const stock=S.pharmacyStock.find(s=>rx.name.toLowerCase().includes(s.name.toLowerCase().split(' ')[0]));
      if(stock)stock.qty=Math.max(0,stock.qty-rx.qty);
      log(`Dispensed Rx: ${rx.name}`); this.refresh(true);
    });

    // ── Patient Portal ──
    st.querySelectorAll('[data-portal]').forEach(card=>card.onclick=()=>{
      const action=card.dataset.portal;
      if(action==='book'){
        if(S.portalBooked){log('Already booked');return;}
        openModal(`<h4>Book Appointment</h4><p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Pick a slot for ${S.patient.name||'Rajesh Kumar'}</p>
          <div class="slot-grid">${['2:00 PM','2:30 PM','3:00 PM','3:30 PM'].map(s=>`<button type="button" class="slot-btn ${S.selectedSlot===s?'picked':''}" data-portal-slot="${s}">${s}</button>`).join('')}</div>
          <button class="btn btn-primary" id="portalConfirmBook" style="width:100%;margin-top:14px;justify-content:center">Confirm →</button>`);
        document.querySelectorAll('[data-portal-slot]').forEach(b=>b.onclick=()=>{S.selectedSlot=b.dataset.portalSlot;document.querySelectorAll('[data-portal-slot]').forEach(x=>x.classList.remove('picked'));b.classList.add('picked');});
        document.getElementById('portalConfirmBook')?.addEventListener('click',()=>{S.portalBooked=true;S.booked=true;closeModal();log(`Portal booking ${S.selectedSlot}`);App.refresh(true);});
      } else if(action==='visits'){
        openModal(`<h4>Visit History</h4>${['Jun 1 — Dr. Patel — Hypertension','May 15 — Dr. Sharma — Fever','Apr 2 — Dr. Patel — Routine'].map(v=>`<div style="padding:10px 0;border-bottom:1px solid var(--border);font-size:12px">${v}</div>`).join('')}<button class="btn btn-primary" data-action="go-book" style="width:100%;margin-top:12px;justify-content:center">Book Next Visit</button>`);
      } else if(action==='rx'){
        if(!S.rx.length){log('No active prescriptions');return;}
        openModal(`<h4>Your Prescriptions</h4>${S.rx.map(r=>`<div class="rx-visual"><div class="rx-pill" style="background:${C.blue}18">💊</div><div><strong>${r.name}</strong><br><span style="font-size:11px;color:var(--text-muted)">${r.dose}</span></div></div>`).join('')}<button class="btn btn-primary" id="portalDlRx" style="width:100%;margin-top:12px;justify-content:center">Download All PDF</button>`);
        document.getElementById('portalDlRx')?.addEventListener('click',()=>{closeModal();log('Rx PDF downloaded');});
      } else if(action==='pay'){
        if(S.portalBillPaid){log('Bill already paid');return;}
        openModal(`<h4>Pay Bill</h4><p style="font-size:28px;font-weight:800;font-family:var(--font-display);color:var(--primary);margin:16px 0">${money(500)}</p>
          <div style="display:flex;gap:8px;margin-bottom:14px">${['UPI','Card','Net Banking'].map(m=>`<button type="button" class="btn btn-ghost pay-btn ${S.paymentMode===m?'active':''}" data-portal-pay="${m}">${m}</button>`).join('')}</div>
          <button class="btn btn-primary" id="portalPayBtn" style="width:100%;justify-content:center">Pay Now →</button>`);
        document.querySelectorAll('[data-portal-pay]').forEach(b=>b.onclick=()=>{S.paymentMode=b.dataset.portalPay;document.querySelectorAll('[data-portal-pay]').forEach(x=>x.classList.remove('active'));b.classList.add('active');});
        document.getElementById('portalPayBtn')?.addEventListener('click',()=>{
          S.portalBillPaid=true; S.paid=true; S.revenue+=500; if(!S.receiptId)S.receiptId=String(Date.now()).slice(-6);
          const pending=S.invoices.find(i=>i.status==='pending'); if(pending)pending.status='paid';
          closeModal(); log(`Portal payment ${money(500)}`); App.refresh(true);
        });
      }
    });

    // Login
    const loginBtn=st.querySelector('#loginBtn');
    if(loginBtn)loginBtn.onclick=()=>{loginBtn.classList.add('btn-loading');loginBtn.textContent='Signing in';setTimeout(()=>{log('Logged in as Receptionist');this.next();},900);};

    // Dashboard search + rows + quick actions
    const search=st.querySelector('#apptSearch');
    if(search){
      search.oninput=e=>{
        S.search=e.target.value;
        const pos=e.target.selectionStart;
        clearTimeout(this._searchTimer);
        this._searchTimer=setTimeout(()=>{
          this.refresh(true);
          const n=document.getElementById('apptSearch');
          if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}
        },150);
      };
    }
    st.querySelectorAll('[data-appt]').forEach(row=>row.onclick=()=>{
      const id=+row.dataset.appt; S.selectedApptId=id;
      const a=S.appointments.find(x=>x.id===id);
      openModal(`<h4>${a.patient}</h4><p style="font-size:13px;color:var(--text-muted);line-height:1.8">Doctor: ${a.doctor}<br>Time: ${a.time}<br>Status: ${a.status}</p><button class="btn btn-primary" style="width:100%;margin-top:10px;justify-content:center" data-action="go-book">Book Follow-up</button>`);
      log(`Opened ${a.patient}`);
    });
    st.querySelectorAll('[data-action]').forEach(btn=>btn.onclick=()=>this.runAction(btn.dataset.action));

    st.querySelectorAll('[data-kpi]').forEach(k=>k.onclick=()=>{
      const l=k.dataset.kpi;
      if(l.includes('Revenue')||l.includes('Collection')||l.includes('Today'))this.go('rc-payment');
      else if(l.includes('Waiting')||l.includes('Queue'))this.go('rc-queue');
      else if(l.includes('Patients'))this.go('rc-dashboard');
      else if(l.includes('Consult'))this.go('dr-followup');
      else if(l.includes('Rx'))this.go('dr-prescription');
    });

    // Save patient
    const saveP=st.querySelector('#savePatientBtn');
    if(saveP)saveP.onclick=()=>{
      const name=st.querySelector('#pName')?.value.trim(), phone=st.querySelector('#pPhone')?.value.replace(/\D/g,'');
      let ok=true;
      const errN=st.querySelector('#errName'), errP=st.querySelector('#errPhone');
      if(!name){errN?.classList.add('show');st.querySelector('#pName')?.classList.add('err');ok=false;}else{errN?.classList.remove('show');st.querySelector('#pName')?.classList.remove('err');}
      if(!phone||phone.length<10){errP?.classList.add('show');st.querySelector('#pPhone')?.classList.add('err');ok=false;}else{errP?.classList.remove('show');st.querySelector('#pPhone')?.classList.remove('err');}
      if(!ok)return;
      S.patient={name,phone,age:st.querySelector('#pAge')?.value||'',gender:st.querySelector('#pGender')?.value||'Male'};
      S.patients++; S.appointments.push({id:Date.now(),patient:name,doctor:'Dr. Patel',time:'12:00',status:'scheduled'});
      log(`Patient saved: ${name}`);
      setTimeout(()=>this.go('rc-book-appt'),600);
    };

    // Book appointment slots
    st.querySelectorAll('[data-slot]').forEach(btn=>btn.onclick=()=>{if(btn.classList.contains('full'))return;S.selectedSlot=btn.dataset.slot;this.refresh(true);});
    const confirmBook=st.querySelector('#confirmBookBtn');
    if(confirmBook)confirmBook.onclick=()=>{
      confirmBook.classList.add('btn-loading');
      setTimeout(()=>{
        S.booked=true; S.waiting++;
        const pName=S.patient.name||'Rajesh Kumar';
        const appt=S.appointments.find(a=>a.patient===pName);
        if(appt){appt.time=S.selectedSlot;appt.status='waiting';}
        log(`Booked ${pName} at ${S.selectedSlot}`);
        this.refresh(true);
      },700);
    };

    // Payment
    st.querySelectorAll('[data-pay]').forEach(btn=>btn.onclick=()=>{S.paymentMode=btn.dataset.pay;this.refresh(true);});
    const markPaid=st.querySelector('#markPaidBtn');
    if(markPaid)markPaid.onclick=()=>{
      markPaid.classList.add('btn-loading');
      setTimeout(()=>{
        S.paid=true; S.revenue+=500; if(!S.receiptId)S.receiptId=String(Date.now()).slice(-6);
        const inv=S.invoices.find(i=>i.status==='pending'); if(inv)inv.status='paid';
        log(`₹500 received via ${S.paymentMode}`); this.refresh(true);
      },800);
    };

    // Queue call next
    st.querySelectorAll('[data-call]').forEach(btn=>btn.onclick=()=>callNext(+btn.dataset.call));
    st.querySelectorAll('[data-token]').forEach(card=>card.onclick=e=>{
      if(e.target.closest('[data-call]'))return;
      const q=S.queue.find(x=>x.token===+card.dataset.token);
      if(q)log(`Token #${q.token} — ${q.name}`);
    });
    const drCall=st.querySelector('#drCallBtn');
    if(drCall)drCall.onclick=()=>{const n=S.queue.find(q=>q.status==='next');if(n)callNext(n.token);};

    const self=this;
    function callNext(token){
      const q=S.queue.find(x=>x.token===token);
      if(!q)return;
      q.status='called'; S.waiting=Math.max(0,S.waiting-1);
      const nextWait=S.queue.find(x=>x.status==='waiting');
      if(nextWait)nextWait.status='next';
      self.updateQueueTimers();
      self.updateLiveKpis();
      log(`Called token #${token} — ${q.name}`);
      self.refresh(true);
      setTimeout(()=>App.go('dr-consult'),800);
    }

    // Consult vitals + notes
    const saveV=st.querySelector('#saveVitalsBtn');
    if(saveV)saveV.onclick=()=>{
      S.vitals.bp=+st.querySelector('#vBp')?.value||S.vitals.bp;
      S.vitals.spo2=+st.querySelector('#vSpo2')?.value||S.vitals.spo2;
      S.vitals.weight=+st.querySelector('#vWeight')?.value||S.vitals.weight;
      log(`Vitals: BP ${S.vitals.bp}, SpO2 ${S.vitals.spo2}%`);
      this.refresh(true);
    };
    const saveN=st.querySelector('#saveNotesBtn');
    if(saveN)saveN.onclick=()=>{S.notes=st.querySelector('#clinicalNotes')?.value||'';log('Notes saved');};

    // Rx
    st.querySelector('#addRxBtn')?.addEventListener('click',()=>{S.rx.push({id:Date.now(),name:'Metformin 500mg',dose:'1 tab BD',dur:'30 days',qty:60});log('Medicine added');this.refresh(true);});
    st.querySelectorAll('[data-del-rx]').forEach(btn=>btn.onclick=()=>{S.rx=S.rx.filter(r=>r.id!==+btn.dataset.delRx);log('Medicine removed');this.refresh(true);});
    st.querySelector('#printRxBtn')?.addEventListener('click',()=>{log('PDF downloaded');window.print();});
    st.querySelector('#portalRxBtn')?.addEventListener('click',()=>log('Rx sent to portal'));

    // Complete consult
    st.querySelector('#completeConsultBtn')?.addEventListener('click',()=>{
      S.consultDone=true; log('Consultation completed');
      this.refresh(true);
    });

    st.querySelector('#sendSmsBtn')?.addEventListener('click',()=>{log('WhatsApp sent to 24 patients');smsNotify('WhatsApp · Appointment reminder sent ✓');});
    patchDetail();
    if(st.querySelector('#liveClock')||['rc-queue','dr-queue'].includes(this.current))this.startLive();
    else this.stopLive();
  },
  render(){
    const s=SCREENS[this.current]; if(!s)return;
    document.getElementById('title').textContent=s.title;
    document.getElementById('meta').textContent=s.meta;
    document.getElementById('stage').innerHTML=s.render();
    document.getElementById('bc').innerHTML=`<span>Demo</span> / <span>${s.role}</span> / <span class="cur">${s.title}</span>`;
    document.getElementById('feats').innerHTML=s.features.map(f=>`<div class="feature-item"><div class="fdot ${f.n?'new':'mvp'}"></div><div>${f.t}${f.n?' <span class="badge badge-new" style="font-size:8px;padding:2px 5px">NEW</span>':''}</div></div>`).join('');
    document.getElementById('gap').textContent=s.gap;
    const b=document.getElementById('badge'); b.textContent=s.status==='new'?'NEW — Build next':'MVP — Live'; b.className='badge '+(s.status==='new'?'badge-new':'badge-mvp');
    const i=this.flow.indexOf(this.current), pct=i>=0?((i+1)/this.flow.length)*100:0;
    document.getElementById('progFill').style.width=pct+'%';
    document.getElementById('progLabel').textContent=s.step?`Step ${s.step} / ${this.flow.length}`:(i>=0?`Step ${i+1} / ${this.flow.length}`:'Pick a flow');
    document.getElementById('dots').innerHTML=this.flow.map((id,j)=>{let c='sdot';if(id===this.current)c+=' on';else if(j<i)c+=' done';return `<div class="${c}" data-dot-go="${id}"></div>`;}).join('');
    document.querySelectorAll('[data-dot-go]').forEach(d=>d.onclick=()=>this.go(d.dataset.dotGo));
    this.syncNav();
    this.bindScreen();
    saveDemoState();
  }
};
function runFigmaExport() {
  document.documentElement.classList.add('figma-export');
  document.querySelector('.app').style.display = 'none';
  document.getElementById('toast').style.display = 'none';
  document.getElementById('modalRoot').style.display = 'none';

  const params = new URLSearchParams(location.search);
  const singleScreen = params.get('screen');

  const root = document.createElement('div');
  root.id = 'figmaExportRoot';
  root.className = 'figma-export-root';

  const order = [...E2E];
  Object.keys(SCREENS).forEach(id => { if (!order.includes(id)) order.push(id); });
  const screens = singleScreen
    ? (SCREENS[singleScreen] ? [singleScreen] : [])
    : order;

  const screenLinks = order.map(id =>
    `<a href="?figma=export&screen=${id}" style="color:#2563eb;font-size:12px;margin:2px 6px 2px 0;display:inline-block">${id}</a>`
  ).join('');

  const banner = document.createElement('div');
  banner.className = 'figma-export-banner';
  banner.innerHTML = singleScreen && !screens.length
    ? `<h1>Unknown screen: ${singleScreen}</h1><p>Valid: ${order.join(', ')}</p>`
    : `<h1>Doctor CRM — Figma Import${singleScreen ? ` · ${singleScreen}` : ''}</h1>
    <p><strong>Tip:</strong> Poora page capture bahut bada hota hai → Figma disk error deta hai.<br/>
    <strong>Ek screen capture karo:</strong> extension → Capture → .h2d → Figma plugin import.</p>
    ${singleScreen ? `<p><a href="?figma=export" style="color:#2563eb">← All screens list</a></p>` : `<div style="margin-top:12px;line-height:2">${screenLinks}</div>`}
    <button type="button" class="figma-export-dl" id="figmaDlBtn">⬇ Download this page as .html</button>`;
  root.appendChild(banner);

  screens.forEach(id => {
    const s = SCREENS[id];
    if (!s) return;
    const frame = document.createElement('div');
    frame.className = 'figma-export-frame';
    frame.dataset.screenId = id;
    frame.innerHTML = `
      <div class="figma-export-label">${id} · ${s.title} · ${s.role}${s.status === 'new' ? ' · NEW' : ' · MVP'}</div>
      <div class="figma-export-content">${s.render()}</div>`;
    root.appendChild(frame);
  });

  document.body.appendChild(root);

  const dl = document.getElementById('figmaDlBtn');
  if (dl) dl.onclick = () => {
    const blob = new Blob(['<!DOCTYPE html>\n' + document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = singleScreen ? `wireframe-${singleScreen}.html` : 'wireframe-figma-static.html';
    a.click();
    URL.revokeObjectURL(a.href);
  };
}

if (new URLSearchParams(location.search).get('figma') === 'export') {
  runFigmaExport();
} else {
  App.init();
  window.App = App;
}
</script>
</body>
</html>

# Production-like stack (separate DB, MaatriDev branding)
services:
  backend:
    env_file:
      - ../backend/.env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      PRODUCTION_DATABASE_URL: postgres://doctorcrm:doctorcrm@postgres:5432/doctor_crm_production
      REDIS_URL: redis://redis:6379
      EMAIL_FROM: MaatriDev <info@maatridev.com>
      SUPPORT_PHONE: '9211611187'
      SUPPORT_EMAIL: info@maatridev.com
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      COOKIE_SECURE: 'false'

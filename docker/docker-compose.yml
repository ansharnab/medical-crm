services:
  postgres:
    image: postgres:15-alpine
    container_name: doctor-crm-postgres
    environment:
      POSTGRES_USER: doctorcrm
      POSTGRES_PASSWORD: doctorcrm
      POSTGRES_DB: doctor_crm
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U doctorcrm -d doctor_crm']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: doctor-crm-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: doctor-crm-backend
    env_file:
      - ../backend/.env.example
    environment:
      DATABASE_URL: postgres://doctorcrm:doctorcrm@postgres:5432/doctor_crm
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm run migrate && npm run seed && npm start"

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: doctor-crm-frontend
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  postgres_data:

<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    h1 { font-size: 15px; font-weight: 600; }
    p { font-size: 12px; color: #94a3b8; line-height: 1.5; }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: 0.5; cursor: wait; }
  </style>
</head>
<body>
  <h1>Doctor CRM Wireframes</h1>
  <p>84 frames · 1 page (Free plan) · prototype links included</p>
  <button id="go">Build All Wireframes</button>
  <script>
    document.getElementById("go").onclick = () => {
      const btn = document.getElementById("go");
      btn.disabled = true;
      btn.textContent = "Building…";
      parent.postMessage({ pluginMessage: { type: "build" } }, "*");
    };
  </script>
</body>
</html>
